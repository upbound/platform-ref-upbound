items:
- apiVersion: meta.dev.upbound.io/v1alpha1
  kind: CompositionTest
  metadata:
    name: test-xsharedawssecret-with-data
  spec:
    assertResources:
    - apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      metadata:
        name: example-env-secrets-read-access-key
      spec:
        deletionPolicy: Orphan
        forProvider:
          manifest:
            apiVersion: v1
            kind: Secret
            metadata:
              name: example-env-secrets-read-access-key
              namespace: example-env
        managementPolicies:
        - '*'
        providerConfigRef:
          name: example-env-group
        references:
        - patchesFrom:
            apiVersion: v1
            fieldPath: data
            kind: Secret
            name: example-env-secrets-read-access-key
            namespace: default
          toFieldPath: data
        watch: false
    - apiVersion: iam.aws.upbound.io/v1beta1
      kind: Policy
      metadata:
        name: example-shared-secret-with-data-example-config-secrets-read
      spec:
        deletionPolicy: Orphan
        forProvider:
          policy: '{"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Action": ["secretsmanager:GetSecretValue", "secretsmanager:DescribeSecret", "secretsmanager:ListSecretVersionIds"], "Resource": ["arn:aws:secretsmanager:us-east-1:123456789012:secret:example-config-*"]}]}'
        managementPolicies:
        - '*'
        providerConfigRef:
          name: example-env
    - apiVersion: iam.aws.upbound.io/v1beta1
      kind: UserPolicyAttachment
      metadata:
        name: example-shared-secret-with-data-example-config-secrets-read
      spec:
        deletionPolicy: Orphan
        forProvider:
          policyArnSelector:
            matchControllerRef: true
          userSelector:
            matchControllerRef: true
        managementPolicies:
        - '*'
        providerConfigRef:
          name: example-env
    - apiVersion: iam.aws.upbound.io/v1beta1
      kind: AccessKey
      metadata:
        name: example-shared-secret-with-data-example-config-secrets-read
      spec:
        deletionPolicy: Orphan
        forProvider:
          userSelector:
            matchControllerRef: true
        managementPolicies:
        - '*'
        providerConfigRef:
          name: example-env
        writeConnectionSecretToRef:
          name: example-env-secrets-read-access-key
          namespace: default
    - apiVersion: iam.aws.upbound.io/v1beta1
      kind: User
      metadata:
        name: example-shared-secret-with-data-example-config-secrets-read
      spec:
        deletionPolicy: Orphan
        forProvider: {}
        managementPolicies:
        - '*'
        providerConfigRef:
          name: example-env
    - apiVersion: secretsmanager.aws.upbound.io/v1beta1
      kind: Secret
      metadata:
        annotations:
          crossplane.io/external-name: arn:aws:secretsmanager:us-east-1:123456789012:secret:example-config-AbCdEf
        name: example-config-secretsmanager-secret
      spec:
        deletionPolicy: Orphan
        forProvider:
          name: example-config
          region: us-east-1
        managementPolicies:
        - '*'
        providerConfigRef:
          name: example-env
    - apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      metadata:
        name: example-ctp-sss
      spec:
        deletionPolicy: Orphan
        forProvider:
          manifest:
            apiVersion: spaces.upbound.io/v1alpha1
            kind: SharedSecretStore
            metadata:
              name: example-ctp
              namespace: example-env
            spec:
              controlPlaneSelector:
                names:
                - example-ctp
              namespaceSelector:
                names:
                - my-namespace
              provider:
                aws:
                  auth:
                    secretRef:
                      accessKeyIDSecretRef:
                        key: username
                        name: example-env-secrets-read-access-key
                      secretAccessKeySecretRef:
                        key: password
                        name: example-env-secrets-read-access-key
                  region: us-east-1
                  service: SecretsManager
        managementPolicies:
        - '*'
        providerConfigRef:
          name: example-env-group
        watch: false
    - apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      metadata:
        name: example-ctp-ses
      spec:
        deletionPolicy: Orphan
        forProvider:
          manifest:
            apiVersion: spaces.upbound.io/v1alpha1
            kind: SharedExternalSecret
            metadata:
              name: custom-external-secret
              namespace: example-env
            spec:
              controlPlaneSelector:
                names:
                - example-ctp
              externalSecretSpec:
                data:
                - secretKey: githubAppPrivateKey
                  remoteRef:
                    conversionStrategy: Default
                    decodingStrategy: None
                    key: example-config
                    metadataPolicy: None
                    property: githubAppPrivateKey
                - secretKey: githubCreds
                  remoteRef:
                    conversionStrategy: Default
                    decodingStrategy: None
                    key: example-config
                    metadataPolicy: None
                    property: githubCreds
                - secretKey: databaseUrl
                  remoteRef:
                    conversionStrategy: Default
                    decodingStrategy: Base64
                    key: example-config
                    metadataPolicy: None
                    property: databaseUrl
                refreshInterval: '1m'
                secretStoreRef:
                  kind: ClusterSecretStore
                  name: example-ctp
                target:
                  creationPolicy: Owner
                  deletionPolicy: Retain
                  name: custom-external-secret
                  template:
                    data:
                      githubAppID: '{{ $creds := .githubCreds | fromJson }}{{ index $creds.app_auth 0 "id" }}'
                      githubInstallationID: '{{ $creds := .githubCreds | fromJson }}{{ index $creds.app_auth 0 "installation_id" }}'
                      githubPrivateKey: '{{ $creds := .githubCreds | fromJson }}{{ index $creds.app_auth 0 "pem_file" | replace "\\n" "\n" }}'
                      type: git
                      url: '{{ $creds := .githubCreds | fromJson }}https://github.com/{{ $creds.owner }}'
                    engineVersion: v2
                    mergePolicy: Replace
                    metadata:
                      labels:
                        app: my-app
                        argocd.argoproj.io/secret-type: repo-creds
                        environment: production
              namespaceSelector:
                names:
                - my-namespace
        managementPolicies:
        - '*'
        providerConfigRef:
          name: example-env-group
        watch: false
    compositionPath: apis/xsharedawssecrets/composition.yaml
    timeoutSeconds: 60
    validate: false
    xrPath: examples/xsharedawssecret/example-with-data.yaml
    xrdPath: apis/xsharedawssecrets/definition.yaml

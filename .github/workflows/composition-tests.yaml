name: Composition Tests

on:
  push:
    branches:
      - main
  pull_request: {}

env:
  # Build functions one at a time. Every Python function build mounts the same
  # up-python-sdk-pip-cache Docker volume, and on a fresh runner - where that volume starts
  # empty - concurrent builds race creating its directories and fail with
  # "mkdir ...: file exists".
  UP_MAX_CONCURRENCY: "1"

jobs:
  composition-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install up
        uses: upbound/action-up@53fe6395637d884c80d2bbc8c2d75d0ece776ced # v1
        with:
          skip-login: true

      - name: Build project
        run: up project build

      - name: Run composition tests
        run: up test run tests/*
